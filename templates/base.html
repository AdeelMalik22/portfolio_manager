<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio Builder - Create Your Professional Portfolio{% endblock %}</title>
    <style>
        /* ============================================
           MODERN DESIGN SYSTEM - Base Styles
           ============================================ */

        :root {
            /* Primary Colors */
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;

            /* Accent Colors */
            --accent: #ec4899;
            --accent-light: #f472b6;

            /* Neutral Colors - Modern grayscale */
            --neutral-50: #fafafa;
            --neutral-100: #f3f4f6;
            --neutral-200: #e5e7eb;
            --neutral-300: #d1d5db;
            --neutral-400: #9ca3af;
            --neutral-500: #6b7280;
            --neutral-600: #4b5563;
            --neutral-700: #374151;
            --neutral-800: #1f2937;
            --neutral-900: #111827;

            /* Status Colors */
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;

            /* Spacing */
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 3rem;

            /* Border Radius */
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;

            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: var(--neutral-50);
            color: var(--neutral-700);
            line-height: 1.6;
            font-size: 1rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================
           NAVIGATION - Modern Header
           ============================================ */
        nav {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            padding: var(--space-lg) var(--space-md);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0;
        }

        nav p {
            font-size: 0.875rem;
            opacity: 0.9;
            margin: 0.25rem 0 0 0;
        }

        /* ============================================
           CONTAINER & LAYOUT
           ============================================ */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: var(--space-md);
        }

        @media (min-width: 640px) {
            .container {
                padding: var(--space-lg);
            }
        }

        @media (min-width: 1024px) {
            .container {
                padding: var(--space-2xl);
            }
        }

        /* ============================================
           BUTTONS - Modern & Interactive
           ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-sm) var(--space-lg);
            background-color: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: var(--radius-lg);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all var(--transition-base);
            font-size: 0.95rem;
            font-weight: 600;
            gap: var(--space-sm);
            white-space: nowrap;
            user-select: none;
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Button Variants */
        .btn-secondary {
            background-color: var(--neutral-200);
            color: var(--neutral-700);
        }

        .btn-secondary:hover {
            background-color: var(--neutral-300);
            box-shadow: var(--shadow-md);
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background-color: var(--primary);
            color: #fff;
        }

        .btn-sm {
            padding: var(--space-xs) var(--space-md);
            font-size: 0.875rem;
        }

        .btn-lg {
            padding: var(--space-md) var(--space-xl);
            font-size: 1.0625rem;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================
           FOOTER - Modern & Minimal
           ============================================ */
        footer {
            background-color: var(--neutral-900);
            color: var(--neutral-100);
            text-align: center;
            padding: var(--space-2xl) var(--space-md);
            margin-top: var(--space-2xl);
            border-top: 1px solid var(--neutral-800);
        }

        footer p {
            margin: 0;
            font-size: 0.9375rem;
            opacity: 0.9;
        }

        footer a {
            color: var(--primary-light);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        footer a:hover {
            color: #fff;
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 640px) {
            nav h1 {
                font-size: 1.3rem;
            }

            nav p {
                display: none;
            }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <!-- Modern Navigation Header -->
    <nav>
        <div class="container">
            <div>
                <h1>🎨 Portfolio Builder</h1>
                <p>Create your professional portfolio in minutes</p>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Modern Footer -->
    <footer>
        <p>&copy; 2026 Portfolio Builder. 100% Free. No Signups. No Ads.</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
